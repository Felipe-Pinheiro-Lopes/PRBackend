services:
  spacedefender-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: spacedefender-dev:latest
    container_name: spacedefender-dev
    environment:
      - PUID=911
      - PGID=911
      - TZ=America/Sao_Paulo
      - SUBFOLDER=/
      - TITLE=Space Defender Dev Environment
    volumes:
      # Persistência de configurações e extensões do VS Code
      - ./data:/config
      # Mapeamento do repositório PRBackend direto dentro do ambiente de trabalho
      - ../:/config/workspace
    ports:
      - "3000:3000" # Acesso HTTP (http://localhost:3000)
      - "3001:3001" # Acesso HTTPS (https://localhost:3001)
    shm_size: "2gb"
    restart: unless-stopped
